<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="clip"><rect width="128" height="128" rx="20"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="20" fill="#000"/>

  <!-- Falling character columns -->
  <g clip-path="url(#clip)" font-family="monospace" font-size="13" fill="#00ff41">
    <!-- Col 1 -->
    <text x="8"  y="18"  fill="#ccffcc" opacity="0.95">ﾊ</text>
    <text x="8"  y="32"  opacity="0.75">ｦ</text>
    <text x="8"  y="46"  opacity="0.55">ｸ</text>
    <text x="8"  y="60"  opacity="0.38">ﾅ</text>
    <text x="8"  y="74"  opacity="0.22">ｿ</text>
    <text x="8"  y="88"  opacity="0.10">ｺ</text>
    <!-- Col 2 -->
    <text x="24" y="38"  fill="#ccffcc" opacity="0.95">ﾓ</text>
    <text x="24" y="52"  opacity="0.75">ｻ</text>
    <text x="24" y="66"  opacity="0.55">ﾈ</text>
    <text x="24" y="80"  opacity="0.35">ｱ</text>
    <text x="24" y="94"  opacity="0.18">ﾗ</text>
    <!-- Col 3 -->
    <text x="40" y="12"  opacity="0.40">ﾊ</text>
    <text x="40" y="26"  opacity="0.28">ｦ</text>
    <text x="40" y="55"  fill="#e0ffe0" opacity="0.98">Z</text>
    <text x="40" y="69"  opacity="0.75">ﾆ</text>
    <text x="40" y="83"  opacity="0.50">ｶ</text>
    <text x="40" y="97"  opacity="0.30">ｿ</text>
    <text x="40" y="111" opacity="0.15">ﾌ</text>
    <!-- Col 4 -->
    <text x="56" y="30"  fill="#ccffcc" opacity="0.95">ﾘ</text>
    <text x="56" y="44"  opacity="0.72">ﾒ</text>
    <text x="56" y="58"  opacity="0.50">ｵ</text>
    <text x="56" y="72"  opacity="0.30">ﾔ</text>
    <text x="56" y="86"  opacity="0.15">9</text>
    <!-- Col 5 -->
    <text x="72" y="22"  opacity="0.35">ﾅ</text>
    <text x="72" y="62"  fill="#ffffff" opacity="0.98">ﾄ</text>
    <text x="72" y="76"  opacity="0.78">ｲ</text>
    <text x="72" y="90"  opacity="0.52">ﾖ</text>
    <text x="72" y="104" opacity="0.30">ｳ</text>
    <!-- Col 6 -->
    <text x="88" y="44"  fill="#ccffcc" opacity="0.95">ﾍ</text>
    <text x="88" y="58"  opacity="0.72">ｻ</text>
    <text x="88" y="72"  opacity="0.48">ｸ</text>
    <text x="88" y="86"  opacity="0.28">ﾗ</text>
    <!-- Col 7 -->
    <text x="104" y="16" fill="#e0ffe0" opacity="0.95">ﾊ</text>
    <text x="104" y="30" opacity="0.75">7</text>
    <text x="104" y="44" opacity="0.52">ﾓ</text>
    <text x="104" y="58" opacity="0.33">ｶ</text>
    <text x="104" y="72" opacity="0.18">ﾛ</text>
    <!-- Col 8 -->
    <text x="118" y="50" fill="#ccffcc" opacity="0.90">ﾋ</text>
    <text x="118" y="64" opacity="0.68">ｾ</text>
    <text x="118" y="78" opacity="0.42">ﾅ</text>
  </g>

  <!-- Green scanline overlay for CRT effect -->
  <g clip-path="url(#clip)" opacity="0.04">
    <rect x="0" y="0"   width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="4"   width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="8"   width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="12"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="16"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="20"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="24"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="28"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="32"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="36"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="40"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="44"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="48"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="52"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="56"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="60"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="64"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="68"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="72"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="76"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="80"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="84"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="88"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="92"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="96"  width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="100" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="104" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="108" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="112" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="116" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="120" width="128" height="1" fill="#00ff41"/>
    <rect x="0" y="124" width="128" height="1" fill="#00ff41"/>
  </g>

  <!-- Border glow -->
  <rect x="0.5" y="0.5" width="127" height="127" rx="19.5" fill="none"
        stroke="rgba(0,255,65,0.35)" stroke-width="1"/>
</svg>
